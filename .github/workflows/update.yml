name: Update rankings and deploy site

on:
  schedule:
    # 05:30 UTC Tue-Sat = after each US trading day's close (EOD data settled).
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    # Refresh data on schedule/manual runs; plain pushes just redeploy the site.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline and validation
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER }}
        run: python -m pipeline.run --no-cache

      - name: Publish price series to the data branch
        run: |
          cd prices_out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Price series $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          cd ..

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update rankings data ($(date -u +%F))"
            # main may have moved during the long pipeline run; rebase and retry
            pushed=""
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            done
            if [ -z "$pushed" ]; then
              echo "::error::failed to push rankings data after 3 attempts"
              exit 1
            fi
          fi

  deploy:
    needs: update
    # Run even when the update job was skipped (push events).
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pick up the data commit made by the update job on whichever ref ran
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
