name: Update rankings

on:
  schedule:
    # 05:30 UTC Tue-Sat = after each US trading day's close (EOD data settled).
    - cron: "30 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline and validation
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER }}
        run: python -m pipeline.run --no-cache

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rankings.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update rankings data ($(date -u +%F))"
            git push
          fi
