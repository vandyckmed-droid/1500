name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  # The nightly data-update workflow commits with the workflow token, which
  # does not emit push events; redeploy after it finishes instead.
  workflow_run:
    workflows: ["Update rankings and deploy site"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip, which includes any
          # data commit the update workflow just pushed.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Check Cloudflare credentials
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings → Secrets and variables → Actions. Create the API token at https://dash.cloudflare.com/profile/api-tokens (template: Edit Cloudflare Workers); the account ID is on the dashboard's Workers & Pages overview page."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
